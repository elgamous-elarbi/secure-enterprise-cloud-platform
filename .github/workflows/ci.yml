name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dgssi_app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install postgresql-client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Apply schema.sql
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d dgssi_app_test -f schema.sql
      - name: Run tests
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: dgssi_app_test
          DB_USER: postgres
          DB_PASSWORD: postgres
          FLASK_SECRET_KEY: ci-test-secret-key
          APP_ENV: development
          LOG_LEVEL: INFO
        run: pytest -v
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t dgssi-app:ci .
      - name: Trivy scan (informatif, ne bloque pas le pipeline)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: dgssi-app:ci
          format: table
          exit-code: '0'
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: eu-north-1
      ECR_REPOSITORY: secip-dev-dgssi
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Debug OIDC token claims
        run: |
          TOKEN=$(curl -sSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          python3 -c "
          import base64, json, sys
          token = '''$TOKEN'''
          payload = token.split('.')[1]
          padded = payload + '=' * (-len(payload) % 4)
          decoded = base64.urlsafe_b64decode(padded)
          claims = json.loads(decoded)
          print(json.dumps({k: claims.get(k) for k in ['aud', 'sub', 'iss', 'repository', 'ref']}, indent=2))
          "
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::523842384893:role/secip-dev-github-actions-role
          aws-region: ${{ env.AWS_REGION }}
      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:latest -t $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }} .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}
      - name: Deploy via SSM
        run: |
          aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=tag:Name,Values=secip-dev-app" \
            --parameters 'commands=["cd /opt/app","docker compose pull","docker compose up -d"]' \
            --region ${{ env.AWS_REGION }} \
            --query "Command.CommandId" \
            --output text