services:

  postgres:
    image: postgres:16
    container_name: dgssi-postgres
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

    networks:
      - dgssi-network


  app:
    build: .
    container_name: dgssi-app
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    env_file:
      - .env

    ports:
      - "5000:5000"

    read_only: true

    tmpfs:
      - /tmp

    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:5000/login || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    networks:
      - dgssi-network


  nginx:
    image: nginx:latest
    container_name: dgssi-nginx
    restart: unless-stopped

    depends_on:
      app:
        condition: service_healthy

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro

    read_only: true

    tmpfs:
      - /var/cache/nginx
      - /var/run

    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate --spider -q https://localhost || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    networks:
      - dgssi-network


volumes:
  postgres_data:


networks:
  dgssi-network:
    driver: bridge